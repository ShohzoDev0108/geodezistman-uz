{% extends "base.html" %}

{% block title %}Kurslar — Geodezistman.uz{% endblock %}

{% block content %}
<div class="sahifa">
  <h1 class="sahifa-sarlavha">Barcha kurslar</h1>

  <div class="karta-grid">
    {% for kurs in kurslar %}
      <div class="karta">
        <div class="karta-teg">{{ kurs.kategoriya.nomi }}</div>
        <div class="karta-nomi">{{ kurs.nomi }}</div>
        <div class="karta-tavsif">{{ kurs.tavsifi }}</div>
      </div>
    {% empty %}
      <p class="bosh-yoq">Hozircha kurslar mavjud emas.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
